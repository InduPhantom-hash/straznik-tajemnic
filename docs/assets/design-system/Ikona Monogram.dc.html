<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;} body{margin:0;}</style>
</helmet>
<div style="position:relative; width:100%; height:100%; container-type:size; overflow:hidden; background:radial-gradient(72% 72% at 50% 44%, #1a1610 0%, #0a0c0f 66%, #060708 100%);">
  <div style="position:absolute; inset:0; background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(201,162,39,.12) 0deg 1.6deg, transparent 1.6deg 11deg);"></div>
  <div style="position:absolute; inset:0; box-shadow:inset 0 0 20cqmin 7cqmin rgba(0,0,0,.72);"></div>
  <!-- diamentowy medalion -->
  <div style="position:absolute; left:50%; top:50%; width:64cqmin; height:64cqmin; transform:translate(-50%,-50%) rotate(45deg); background:radial-gradient(60% 60% at 50% 50%, rgba(13,148,136,.34), rgba(13,148,136,.06) 70%); border:2.4cqmin solid #c9a227; box-shadow:0 0 8cqmin rgba(201,162,39,.4), inset 0 0 6cqmin rgba(13,148,136,.35);"></div>
  <div style="position:absolute; left:50%; top:50%; width:52cqmin; height:52cqmin; transform:translate(-50%,-50%) rotate(45deg); border:0.7cqmin solid rgba(201,162,39,.55);"></div>
  <!-- Oko Horusa w medalionie -->
  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Noto Sans Egyptian Hieroglyphs',serif; font-size:34cqmin; line-height:1; color:#c9a227; text-shadow:0 0 6cqmin rgba(201,162,39,.6), 0 0 14cqmin rgba(13,148,136,.4);">𓂀</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:256}}"></script>
</body>
</html>

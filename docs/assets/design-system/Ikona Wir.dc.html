<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>*{box-sizing:border-box;} body{margin:0;}</style>
</helmet>
<div style="position:relative; width:100%; height:100%; container-type:size; overflow:hidden; background:radial-gradient(70% 70% at 50% 48%, #1a1610 0%, #0a0c0f 66%, #060708 100%);">
  <div style="position:absolute; inset:0; background:radial-gradient(26% 26% at 50% 50%, rgba(13,148,136,.55), transparent 70%);"></div>
  <div style="position:absolute; inset:0; box-shadow:inset 0 0 20cqmin 7cqmin rgba(0,0,0,.72);"></div>
  <!-- wir zagnieżdżonych rombów -->
  <div style="position:absolute; left:50%; top:50%; width:82cqmin; height:82cqmin; transform:translate(-50%,-50%) rotate(45deg); border:1.3cqmin solid rgba(201,162,39,.85); box-shadow:0 0 5cqmin rgba(201,162,39,.3);"></div>
  <div style="position:absolute; left:50%; top:50%; width:66cqmin; height:66cqmin; transform:translate(-50%,-50%) rotate(58deg); border:1.2cqmin solid rgba(201,162,39,.7);"></div>
  <div style="position:absolute; left:50%; top:50%; width:51cqmin; height:51cqmin; transform:translate(-50%,-50%) rotate(70deg); border:1.1cqmin solid rgba(201,162,39,.62);"></div>
  <div style="position:absolute; left:50%; top:50%; width:37cqmin; height:37cqmin; transform:translate(-50%,-50%) rotate(82deg); border:1cqmin solid rgba(13,148,136,.85);"></div>
  <div style="position:absolute; left:50%; top:50%; width:24cqmin; height:24cqmin; transform:translate(-50%,-50%) rotate(94deg); border:1cqmin solid rgba(13,148,136,.95); box-shadow:0 0 5cqmin rgba(13,148,136,.6);"></div>
  <!-- emerald rdzeń -->
  <div style="position:absolute; left:50%; top:50%; width:12cqmin; height:12cqmin; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, #1ad0bd, #0d9488 60%, #0a6b62); box-shadow:0 0 10cqmin rgba(13,148,136,.9);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:256}}"></script>
</body>
</html>

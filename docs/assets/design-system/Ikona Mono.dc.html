<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;} body{margin:0;}</style>
</helmet>
<div style="position:relative; width:100%; height:100%; container-type:size; overflow:hidden; background:#0a0c0f;">
  <div style="position:absolute; inset:0; background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(13,148,136,.12) 0deg 1.6deg, transparent 1.6deg 9deg);"></div>
  <div style="position:absolute; inset:0; background:radial-gradient(30% 30% at 50% 50%, rgba(13,148,136,.32), transparent 70%);"></div>
  <div style="position:absolute; inset:7%; border:1cqmin solid rgba(13,148,136,.4);"></div>
  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Noto Sans Egyptian Hieroglyphs',serif; font-size:48cqmin; line-height:1; color:#11b3a3; text-shadow:0 0 7cqmin rgba(13,148,136,.85), 0 0 16cqmin rgba(13,148,136,.4);">𓂀</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:256}}"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;} body{margin:0;}</style>
</helmet>
<div style="position:relative; width:100%; height:100%; container-type:size; overflow:hidden; background:radial-gradient(72% 72% at 50% 44%, #1a1610 0%, #0a0c0f 66%, #060708 100%);">
  <div style="position:absolute; inset:0; background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(201,162,39,.17) 0deg 1.6deg, transparent 1.6deg 9deg);"></div>
  <div style="position:absolute; inset:0; background:radial-gradient(30% 30% at 50% 50%, rgba(13,148,136,.5), transparent 70%);"></div>
  <div style="position:absolute; inset:0; box-shadow:inset 0 0 20cqmin 7cqmin rgba(0,0,0,.72);"></div>
  <div style="position:absolute; inset:7%; border:1cqmin solid rgba(201,162,39,.45);"></div>
  <div style="position:absolute; left:7%; top:7%; width:9%; height:9%; border-top:1.6cqmin solid #c9a227; border-left:1.6cqmin solid #c9a227;"></div>
  <div style="position:absolute; right:7%; top:7%; width:9%; height:9%; border-top:1.6cqmin solid #c9a227; border-right:1.6cqmin solid #c9a227;"></div>
  <div style="position:absolute; left:7%; bottom:7%; width:9%; height:9%; border-bottom:1.6cqmin solid #c9a227; border-left:1.6cqmin solid #c9a227;"></div>
  <div style="position:absolute; right:7%; bottom:7%; width:9%; height:9%; border-bottom:1.6cqmin solid #c9a227; border-right:1.6cqmin solid #c9a227;"></div>
  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Noto Sans Egyptian Hieroglyphs',serif; font-size:48cqmin; line-height:1; color:#11b3a3; text-shadow:0 0 7cqmin rgba(13,148,136,.9), 0 0 18cqmin rgba(13,148,136,.45);">𓂀</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:256}}"></script>
</body>
</html>
